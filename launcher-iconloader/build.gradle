plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
}

// iconloaderlib (com.android.launcher3.icons.*) — migrated from
// frameworks/libs/systemui/iconloaderlib/Android.bp (android_library
// "iconloader_base"). The launcher uses BaseIconFactory, BitmapInfo,
// FastBitmapDrawable, IconProvider etc. at runtime (the launcher's own
// IconCache extends BaseIconCache), so the classes are packaged into the APK
// (previously two compileOnly Soong jars). The res dir (themed icon colors,
// badge drawables) merges into the launcher package; the manual iconloader res
// copy in the launcher's prepareGradleWmShellSharedRes task becomes redundant
// and is removed.
def lineageRoot = rootProject.ext.lineageRoot
def iconSrc = "${lineageRoot}/frameworks/libs/systemui/iconloaderlib/src"
def iconRes = "${lineageRoot}/frameworks/libs/systemui/iconloaderlib/res"

android {
    namespace 'com.android.launcher3.icons'
    compileSdk 36

    defaultConfig {
        minSdk 31
        targetSdk 36
    }

    sourceSets {
        main {
            java.srcDirs = [iconSrc]
            kotlin.srcDirs = [iconSrc]
            res.srcDirs = [iconRes]
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    kotlinOptions {
        jvmTarget = '21'
        languageVersion = '1.9'
        apiVersion = '1.9'
        // Matches Android.bp kotlincflags: ["-Xjvm-default=all"].
        freeCompilerArgs += ['-Xjvm-default=all']
    }
}

dependencies {
    // Full framework (sdk_version current; hidden members if any) — the root
    // build.gradle puts it first on the compile classpath; the platform
    // provides it at runtime.
    compileOnly files(rootProject.ext.frameworkJar)
    // com.android.launcher3.Flags / com.android.systemui.shared.Flags aconfig
    // classes (compileOnly; the launcher packages the real classes from the
    // same vendored jars).
    compileOnly files(rootProject.ext.platformJar(
            'out/soong/.intermediates/packages/apps/Launcher3/aconfig/com_android_launcher3_flags_lib/android_common/javac/com_android_launcher3_flags_lib.jar'))
    compileOnly files(rootProject.ext.platformJar(
            'out/soong/.intermediates/frameworks/libs/systemui/aconfig/com_android_systemui_shared_flags_lib/android_common/javac/com_android_systemui_shared_flags_lib.jar'))
    implementation 'androidx.core:core-ktx:1.15.0'
}
