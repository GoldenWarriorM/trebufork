name: Build Magisk module

# Builds the release APK, signs it with the vendored platform key and packages
# the Magisk module on every push to main / pull request, uploading the ZIP as
# a downloadable artifact. Tag pushes are handled by release.yml.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up build environment
        uses: ./.github/actions/setup-build

      - name: Build release APK
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          gradle :launcher:assembleRelease

      - name: Set up platform signing key from secrets
        run: |
          mkdir -p "$RUNNER_TEMP/platform-key"
          echo "${{ secrets.PLATFORM_PK8_B64 }}" | base64 -d > "$RUNNER_TEMP/platform-key/platform.pk8"
          echo "${{ secrets.PLATFORM_PEM_B64 }}" | base64 -d > "$RUNNER_TEMP/platform-key/platform.x509.pem"
          echo "PLATFORM_PK8=$RUNNER_TEMP/platform-key/platform.pk8" >> "$GITHUB_ENV"
          echo "PLATFORM_PEM=$RUNNER_TEMP/platform-key/platform.x509.pem" >> "$GITHUB_ENV"

      - name: Package Magisk module (signs with the platform key)
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          ./package-magisk.sh

      - name: Upload module ZIP
        uses: actions/upload-artifact@v4
        with:
          name: trebufork-magisk
          path: build/Trebufork-magisk-*.zip
          if-no-files-found: error
