name: Build and publish Magisk module release

# Builds the release APK, signs it with the vendored platform key, packages the
# Magisk module and publishes it as a GitHub Release. Also refreshes
# magisk/update.json on main so Magisk's in-app update check finds the new
# version. Triggered by the `release.sh` helper which bumps the version and
# pushes a v* tag.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up build environment
        uses: ./.github/actions/setup-build

      - name: Build release APK
        run: gradle :launcher:assembleRelease
        env:
          ANDROID_HOME: $ANDROID_HOME
          ANDROID_SDK_ROOT: $ANDROID_HOME

      - name: Package Magisk module (signs with vendored platform key)
        run: ./package-magisk.sh

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/Trebufork-magisk-*.zip
          generate_release_notes: true

      - name: Refresh magisk/update.json on main
        run: |
          TAG="${GITHUB_REF_NAME}"
          VER="$(grep -m1 '^version=' magisk-template/module.prop | cut -d= -f2)"
          CODE="$(grep -m1 '^versionCode=' magisk-template/module.prop | cut -d= -f2)"
          ZIP="build/Trebufork-magisk-$(echo "$VER" | tr ' ' '_').zip"
          ZIP_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/$(basename "$ZIP")"
          cat > magisk/update.json <<EOF
          {
            "version": "$VER",
            "versionCode": $CODE,
            "zipUrl": "$ZIP_URL",
            "changelog": "https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
          }
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add magisk/update.json
          git commit -m "Refresh Magisk update.json for ${TAG}"
          git push origin HEAD:main
