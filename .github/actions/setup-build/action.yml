name: Set up build environment
description: Installs Java 21, the Android SDK and Gradle 8.13 (the repo ships no wrapper).

runs:
  using: composite
  steps:
    - name: Set up Java 21
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '21'

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3

    - name: Install missing SDK components
      run: |
        yes | sdkmanager --licenses >/dev/null || true
        sdkmanager "platforms;android-36" "build-tools;36.1.0" || true
      shell: bash

    - name: Set up Gradle 8.13 (repo has no wrapper)
      run: |
        curl -fsSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.13-bin.zip
        unzip -q /tmp/gradle.zip -d /opt
        echo "/opt/gradle-8.13/bin" >> "$GITHUB_PATH"
      shell: bash
