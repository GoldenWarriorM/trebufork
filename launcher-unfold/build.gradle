plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.kapt'
}

// SystemUIUnfoldLib (com.android.systemui.unfold.*) — migrated from
// frameworks/base/packages/SystemUI/unfold/Android.bp. The launcher uses
// UnfoldTransitionProgressProvider etc. at runtime (via the shared lib), so
// the classes are packaged into the APK (previously two compileOnly Soong
// jars). Includes the two unfold AIDL interfaces.
def lineageRoot = rootProject.ext.lineageRoot
def unfoldSrc = "${lineageRoot}/frameworks/base/packages/SystemUI/unfold/src"

android {
    namespace 'com.android.systemui.unfold'
    compileSdk 36

    defaultConfig {
        minSdk 26
        targetSdk 36
    }

    buildFeatures {
        aidl true
    }

    sourceSets {
        main {
            java.srcDirs = [unfoldSrc]
            kotlin.srcDirs = [unfoldSrc]
            aidl.srcDirs = [unfoldSrc]
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    kotlinOptions {
        jvmTarget = '21'
        languageVersion = '1.9'
        apiVersion = '1.9'
        // Matches Android.bp kotlincflags: ["-Xjvm-default=all"].
        freeCompilerArgs += ['-Xjvm-default=all']
    }
}

dependencies {
    implementation 'androidx.dynamicanimation:dynamicanimation:1.1.0-alpha04'
    // dagger annotations on the unfold interfaces/modules.
    implementation 'com.google.dagger:dagger:2.60.1'
    implementation 'javax.inject:javax.inject:1'
    // UnfoldTransitionFactory references the generated DaggerUnfoldSharedComponent
    // / DaggerRemoteUnfoldSharedComponent (Android.bp: plugins: dagger2-compiler).
    kapt 'com.google.dagger:dagger-compiler:2.60.1'
}
