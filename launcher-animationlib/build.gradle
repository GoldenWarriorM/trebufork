plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
}

// animationlib (com.android.app.animation.*) — migrated from
// frameworks/libs/systemui/animationlib/Android.bp (android_library
// "animationlib"). The launcher calls Animations.setOngoingAnimation and the
// Interpolators at runtime, so the classes are packaged into the APK
// (previously two compileOnly Soong jars: the javac variant carrying
// Interpolators/MathUtils and the kotlin variant carrying Animations).
// sdk_version "system_current" in the bp: compiles against the full framework.
def lineageRoot = rootProject.ext.lineageRoot

android {
    namespace 'com.android.app.animation'
    compileSdk 36

    defaultConfig {
        minSdk 26
        targetSdk 36
    }

    sourceSets {
        main {
            java.srcDirs = ["${lineageRoot}/frameworks/libs/systemui/animationlib/src"]
            kotlin.srcDirs = ["${lineageRoot}/frameworks/libs/systemui/animationlib/src"]
            res.srcDirs = ["${lineageRoot}/frameworks/libs/systemui/animationlib/res"]
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    kotlinOptions {
        jvmTarget = '21'
        languageVersion = '1.9'
        apiVersion = '1.9'
        // Matches Android.bp kotlincflags: ["-Xjvm-default=all"].
        freeCompilerArgs += ['-Xjvm-default=all']
    }
}

dependencies {
    // Full framework (system_current: hidden APIs) — the root build.gradle puts
    // it first on the compile classpath; the platform provides it at runtime.
    compileOnly files(rootProject.ext.frameworkJar)
    implementation 'androidx.core:core-animation:1.0.0'
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.annotation:annotation:1.9.1'
}
