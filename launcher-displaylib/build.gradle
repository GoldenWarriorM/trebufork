plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.kapt'
}

// displaylib (com.android.app.displaylib.*) — migrated from
// frameworks/libs/systemui/displaylib/Android.bp (java_library "displaylib",
// srcs = src/**/*.kt). The launcher's PerDisplayModule (quickstep dagger graph)
// calls DisplayLibComponent/createDisplayLibComponent at runtime, so the
// classes are packaged into the APK (previously a vendored Soong jar pair).
def lineageRoot = rootProject.ext.lineageRoot

android {
    namespace 'com.android.app.displaylib'
    compileSdk 36

    defaultConfig {
        minSdk 31
        targetSdk 36
    }

    sourceSets {
        main {
            kotlin.srcDirs = ["${lineageRoot}/frameworks/libs/systemui/displaylib/src"]
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    kotlinOptions {
        jvmTarget = '21'
        languageVersion = '1.9'
        apiVersion = '1.9'
        // Matches Android.bp kotlincflags (-Xjvm-default=all).
        freeCompilerArgs += ['-Xjvm-default=all']
    }
}

tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
    // Test-only fakes (FakePerDisplayRepository) are not used by the launcher;
    // sourceSets.kotlin.exclude is not honored by AGP 8.9 mixed-source wiring.
    exclude('**/fakes/**')
}

dependencies {
    // Full framework (hidden IWindowManager/IDisplayWindowListener,
    // com.android.internal.annotations.GuardedBy, android.window.DesktopExperienceFlags).
    compileOnly files(rootProject.ext.frameworkJar)
    // tracinglib-platform: TraceUtils.traceAsync / com.android.app.tracing.coroutines.
    implementation project(':launcher-tracing')
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'
    // dagger2 + dagger2-compiler (Android.bp plugins: ["dagger2-compiler"]) —
    // generates createDisplayLibComponent / DaggerDisplayLibComponent.
    implementation 'com.google.dagger:dagger:2.60.1'
    implementation 'javax.inject:javax.inject:1'
    kapt 'com.google.dagger:dagger-compiler:2.60.1'
}
