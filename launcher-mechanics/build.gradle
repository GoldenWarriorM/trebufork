plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
    // The sources are @Composable: Kotlin 2.x needs the compose compiler to
    // lower composable calls (remember/LaunchedEffect inlining fails without it).
    id 'org.jetbrains.kotlin.plugin.compose'
}

// mechanics (com.android.mechanics.*) — migrated from
// frameworks/libs/systemui/mechanics/Android.bp (android_library "mechanics").
// The launcher calls MotionSpec/Breakpoint/spring and the touch controllers at
// runtime, so the classes are packaged into the APK (previously a compileOnly
// Soong jar). Deps mirror the Android.bp static_libs: compose runtime,
// material3, ui-util and foundation-layout.
def lineageRoot = rootProject.ext.lineageRoot

android {
    namespace 'com.android.mechanics'
    compileSdk 36

    defaultConfig {
        minSdk 31
        targetSdk 36
    }

    sourceSets {
        main {
            kotlin.srcDirs = ["${lineageRoot}/frameworks/libs/systemui/mechanics/src"]
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    kotlinOptions {
        jvmTarget = '21'
        languageVersion = '1.9'
        apiVersion = '1.9'
        // Matches Android.bp kotlincflags: ["-Xjvm-default=all"].
        freeCompilerArgs += ['-Xjvm-default=all']
    }
}

dependencies {
    // Full framework (hidden APIs) — the root build.gradle puts it first on the
    // compile classpath; the platform provides it at runtime.
    compileOnly files(rootProject.ext.frameworkJar)
    implementation 'androidx.annotation:annotation:1.9.1'
    implementation 'androidx.collection:collection-jvm:1.5.0'
    implementation 'androidx.compose.runtime:runtime-android:1.10.0-alpha01'
    implementation 'androidx.compose.ui:ui-android:1.10.0-alpha01'
    implementation 'androidx.compose.ui:ui-util-android:1.10.0-alpha01'
    implementation 'androidx.compose.foundation:foundation-layout-android:1.10.0-alpha01'
    implementation 'androidx.compose.material3:material3-android:1.4.0-alpha17'
    implementation 'androidx.compose.animation:animation-core-android:1.10.0-alpha01'
}
