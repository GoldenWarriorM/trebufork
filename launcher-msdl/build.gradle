plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
}

// MotionSpecDSL (com.google.android.msdl.*) — migrated from
// frameworks/libs/systemui/msdllib/Android.bp (android_library "msdl").
// The launcher calls MSDLToken/MotionSpecPlayer/etc. at runtime, so the classes
// are packaged into the APK via this implementation dependency (previously they
// came from a compileOnly Soong jar and were absent from the APK).
def lineageRoot = rootProject.ext.lineageRoot

android {
    namespace 'com.google.android.msdl'
    compileSdk 36

    defaultConfig {
        minSdk 31
        targetSdk 36
    }

    sourceSets {
        main {
            kotlin.srcDirs = ["${lineageRoot}/frameworks/libs/systemui/msdllib/src"]
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    kotlinOptions {
        jvmTarget = '21'
        languageVersion = '1.9'
        apiVersion = '1.9'
        // Matches Android.bp kotlincflags: ["-Xjvm-default=all"].
        freeCompilerArgs += ['-Xjvm-default=all']
    }
}

dependencies {
    // Full framework (hidden APIs) — the root build.gradle puts it first on the
    // compile classpath; the platform provides it at runtime.
    compileOnly files(rootProject.ext.frameworkJar)
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'
    implementation 'androidx.annotation:annotation:1.9.1'
}
