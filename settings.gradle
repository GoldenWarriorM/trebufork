pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id 'com.android.application' version '8.9.1' apply false
    id 'com.android.library' version '8.9.1' apply false
    id 'org.jetbrains.kotlin.android' version '2.2.10' apply false
    id 'org.jetbrains.kotlin.kapt' version '2.2.10' apply false
    id 'org.jetbrains.kotlin.plugin.compose' version '2.2.10' apply false
    id 'com.google.protobuf' version '0.9.5' apply false
}

rootProject.name = 'trebufork-gradle'

// Like Lawnchair, the launcher is the root Android application module. This
// keeps the existing Launcher3 layout and avoids an artificial app/ subfolder.
include ':launcher'
include ':launcher-settingslib'
include ':launcher-res'
include ':launcher-dagger-qualifiers'
include ':launcher-concurrent'
include ':launcher-widgetpicker'
include ':launcher-msdl'
include ':launcher-tracing'
include ':launcher-mechanics'
include ':launcher-animationlib'
include ':launcher-contextualeducation'
include ':launcher-rotation'
include ':launcher-wmshell'
include ':launcher-platformanimation'
include ':launcher-iconloader'
include ':launcher-displaylib'
include ':launcher-viewcapture'
include ':launcher-systemui-log'
include ':launcher-pluginlib'
include ':launcher-plugin-annotations'
include ':launcher-plugin-core'
include ':launcher-unfold'
include ':launcher-systemui-shared'
include ':launcher-flags'
include ':launcher-flags-framework'
