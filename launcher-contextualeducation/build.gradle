plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
}

// contextualeducationlib (com.android.systemui.contextualeducation.*) —
// migrated from frameworks/libs/systemui/contextualeducationlib/Android.bp.
// The launcher's SystemUiProxy references GestureType at runtime, so the
// classes are packaged into the APK (previously a compileOnly Soong jar).
// sdk_version "system_current" in the bp: compiles against the full framework.
def lineageRoot = rootProject.ext.lineageRoot

android {
    namespace 'com.android.systemui.contextualeducation'
    compileSdk 36

    defaultConfig {
        minSdk 26
        targetSdk 36
    }

    sourceSets {
        main {
            kotlin.srcDirs = ["${lineageRoot}/frameworks/libs/systemui/contextualeducationlib/src"]
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    kotlinOptions {
        jvmTarget = '21'
        languageVersion = '1.9'
        apiVersion = '1.9'
        // Matches Android.bp kotlincflags: ["-Xjvm-default=all"].
        freeCompilerArgs += ['-Xjvm-default=all']
    }
}

dependencies {
    // Full framework (system_current) — the root build.gradle puts it first on
    // the compile classpath; the platform provides it at runtime.
    compileOnly files(rootProject.ext.frameworkJar)
}
